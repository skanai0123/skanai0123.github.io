<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ひとつのインタラクティブな図で、ポアンカレ球・偏光楕円・ストークスパラメータの関係を理解する教材です。">
  <meta name="theme-color" content="#061827">
  <title>ポアンカレ球｜一枚でわかる偏光の地図</title>
  <link rel="icon" href="../shared/icons/physics.svg" type="image/svg+xml">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-118J91MG59"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-118J91MG59');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/back-to-hub.css">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="../shared/back-to-hub.js"></script>
  <script defer src="./script.js"></script>
</head>
<body data-page-version="1.1.0" data-page-updated="2026-08-09" data-page-copyright="© 2026 skanai">
  <main class="page-shell">
    <header class="page-heading">
      <div>
        <p class="eyebrow">POLARIZATION ATLAS / 01</p>
        <h1>ポアンカレ球</h1>
      </div>
      <p class="intro">球の一点を動かすと、偏光楕円と3つのストークス成分が同時に変わります。</p>
    </header>

    <figure class="atlas" aria-labelledby="figure-title" aria-describedby="figure-note">
      <div class="atlas-topline">
        <div>
          <span class="status-dot" aria-hidden="true"></span>
          <span id="figure-title">INTERACTIVE POLARIZATION MAP</span>
        </div>
        <span>CLICK：状態を選ぶ　/　DRAG：球を回す</span>
      </div>

      <div class="canvas-wrap">
        <canvas id="atlasCanvas" aria-label="ポアンカレ球、偏光楕円、ストークスパラメータを統合したインタラクティブ図。球面をクリックして偏光状態を選べます。"></canvas>
      </div>

      <div class="controls" aria-label="偏光状態の操作">
        <div class="presets" role="group" aria-label="代表的な偏光状態">
          <button type="button" class="preset is-active" data-psi="0" data-chi="0">H</button>
          <button type="button" class="preset" data-psi="90" data-chi="0">V</button>
          <button type="button" class="preset" data-psi="45" data-chi="0">+45°</button>
          <button type="button" class="preset" data-psi="-45" data-chi="0">−45°</button>
          <button type="button" class="preset" data-psi="0" data-chi="45">L</button>
          <button type="button" class="preset" data-psi="0" data-chi="-45">R</button>
        </div>

        <div class="control-mode" role="group" aria-label="調整方法">
          <button type="button" class="mode-button is-active" data-control-mode="angles">ψ / χ</button>
          <button type="button" class="mode-button" data-control-mode="stokes">S₁ / S₂ / S₃</button>
        </div>

        <div class="control-area">
          <div id="angleControls" class="control-set">
            <label class="range-control" for="psiInput">
              <span><b>方位角 ψ</b><output id="psiValue">0.0°</output></span>
              <input id="psiInput" type="range" min="-90" max="90" step="0.5" value="0">
            </label>

            <label class="range-control" for="chiInput">
              <span><b>楕円率角 χ</b><output id="chiValue">0.0°</output></span>
              <input id="chiInput" type="range" min="-45" max="45" step="0.5" value="0">
            </label>
          </div>

          <div id="stokesControls" class="control-set stokes-controls" hidden>
            <label class="range-control" for="s1Input">
              <span><b>S₁</b><output id="s1InputValue">+1.000</output></span>
              <input id="s1Input" type="range" min="-1" max="1" step="0.001" value="1">
            </label>
            <label class="range-control" for="s2Input">
              <span><b>S₂</b><output id="s2InputValue">0.000</output></span>
              <input id="s2Input" type="range" min="-1" max="1" step="0.001" value="0">
            </label>
            <label class="range-control" for="s3Input">
              <span><b>S₃</b><output id="s3InputValue">0.000</output></span>
              <input id="s3Input" type="range" min="-1" max="1" step="0.001" value="0">
            </label>
          </div>
        </div>

        <div class="actions">
          <button id="showAntipode" type="button">反対側＝直交偏光</button>
          <button id="resetView" type="button">視点を戻す</button>
        </div>
      </div>

      <figcaption id="figure-note" class="map-key">
        <span><i class="key-equator" aria-hidden="true"></i><b>赤道</b>＝直線偏光</span>
        <span><i class="key-pole" aria-hidden="true"></i><b>両極</b>＝円偏光</span>
        <span><i class="key-middle" aria-hidden="true"></i><b>その間</b>＝楕円偏光</span>
        <span class="convention">規約：+S<sub>3</sub> = L、−S<sub>3</sub> = R</span>
      </figcaption>
    </figure>
  </main>
</body>
</html>
